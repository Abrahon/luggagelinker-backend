name: Deploy LuggageLinker

on:
  workflow_run:
    workflows:
      - "LuggageLinker CI"
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            echo "======================================"
            echo "LuggageLinker Deployment Started"
            echo "======================================"

            cd /home/ubuntu/luggage/luggagelinker-backend

            echo "Pulling latest code..."

            git fetch origin main
            git reset --hard origin/main

            echo "Activating virtual environment..."

            source evnv/bin/activate

            echo "Installing dependencies..."

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            export DJANGO_SETTINGS_MODULE=core.settings

            echo "Running Django check..."

            python manage.py check

            echo "Running migrations..."

            python manage.py migrate --noinput

            echo "Collecting static files..."

            python manage.py collectstatic --noinput

            echo "Restarting backend..."

            pm2 restart luggagelinker-backend

            pm2 save

            echo "======================================"
            echo "LuggageLinker Deployment Completed"
            echo "======================================"