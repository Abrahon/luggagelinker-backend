name: LuggageLinker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Django CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: luggagelinker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d luggagelinker_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DB_NAME: luggagelinker_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          CLOUDINARY_CLOUD_NAME: ci-test
          CLOUDINARY_API_KEY: ci-test
          CLOUDINARY_API_SECRET: ci-test
        run: |
          python manage.py check

      - name: Check migrations
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DB_NAME: luggagelinker_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          CLOUDINARY_CLOUD_NAME: ci-test
          CLOUDINARY_API_KEY: ci-test
          CLOUDINARY_API_SECRET: ci-test
        run: |
          python manage.py makemigrations --check --dry-run
